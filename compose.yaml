services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repo_miner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-repo_miner_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-repo_miner}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/${POSTGRES_DB:-repo_miner_dev}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      GITLAB_CREDENTIAL_ENCRYPTION_KEYS: ${GITLAB_CREDENTIAL_ENCRYPTION_KEYS:-}
      GITLAB_CONNECT_TIMEOUT_SECONDS: ${GITLAB_CONNECT_TIMEOUT_SECONDS:-5}
      GITLAB_READ_TIMEOUT_SECONDS: ${GITLAB_READ_TIMEOUT_SECONDS:-10}
      GITLAB_WRITE_TIMEOUT_SECONDS: ${GITLAB_WRITE_TIMEOUT_SECONDS:-5}
      GITLAB_POOL_TIMEOUT_SECONDS: ${GITLAB_POOL_TIMEOUT_SECONDS:-5}
      FINDING_DIFF_MAX_FILES: ${FINDING_DIFF_MAX_FILES:-100}
      FINDING_DIFF_MAX_FILE_BYTES: ${FINDING_DIFF_MAX_FILE_BYTES:-262144}
      FINDING_DIFF_MAX_TOTAL_BYTES: ${FINDING_DIFF_MAX_TOTAL_BYTES:-2097152}
      FINDING_DIFF_MAX_PATH_BYTES: ${FINDING_DIFF_MAX_PATH_BYTES:-4096}
      EXECUTION_STALENESS_THRESHOLD_SECONDS: ${EXECUTION_STALENESS_THRESHOLD_SECONDS:-300}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
